<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Acrylic Squircle Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141E33" />
      <stop offset="50%" stop-color="#0E1626" />
      <stop offset="100%" stop-color="#090D17" />
    </linearGradient>

    <!-- Squircle Border Highlight -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.35" />
      <stop offset="50%" stop-color="#2878F0" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#1E293B" stop-opacity="0.4" />
    </linearGradient>

    <!-- Optical Lens Ring Gradient -->
    <linearGradient id="lensRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#56CCF2" />
      <stop offset="45%" stop-color="#2F80ED" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>

    <!-- Dynamic Discovery Beam Gradient -->
    <linearGradient id="beamGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#1E40AF" />
    </linearGradient>

    <!-- Document Card 1 (Back / Folder facet) -->
    <linearGradient id="cardBack" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <!-- Document Card 2 (Front / Active document) -->
    <linearGradient id="cardFront" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#2878F0" stop-opacity="0.1" />
    </linearGradient>

    <!-- Focal Point Star Glow -->
    <linearGradient id="starGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#7DD3FC" />
    </linearGradient>

    <!-- Subtle inner drop shadow filter -->
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Base Acrylic Windows 11 Squircle -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="4" filter="url(#softShadow)" />

  <!-- Inner Ambient Glow behind search optic -->
  <circle cx="218" cy="218" r="130" fill="#2878F0" opacity="0.12" filter="blur(24px)" />

  <!-- === Layer 1: Layered Document / Folder Planes Inside Search Lens === -->
  <g transform="translate(4, 0)">
    <!-- Back Folder Card -->
    <rect x="156" y="142" width="116" height="136" rx="14" fill="url(#cardBack)" stroke="#334155" stroke-width="3" />
    <!-- Back Folder Tab -->
    <path d="M156 156 L156 148 C156 142 160 138 166 138 L196 138 C200 138 204 140 207 143 L215 151 L246 151 C252 151 256 155 256 161" fill="none" stroke="#475569" stroke-width="3" stroke-linecap="round" />

    <!-- Front Active Document Card (Semi-transparent cyan glass) -->
    <rect x="178" y="164" width="116" height="136" rx="14" fill="url(#cardFront)" stroke="#38BDF8" stroke-opacity="0.5" stroke-width="3" />
    
    <!-- Document Text Lines (Extracted text visualization) -->
    <line x1="198" y1="194" x2="260" y2="194" stroke="#7DD3FC" stroke-width="4.5" stroke-linecap="round" stroke-opacity="0.85" />
    <line x1="198" y1="212" x2="274" y2="212" stroke="#94A3B8" stroke-width="4" stroke-linecap="round" stroke-opacity="0.75" />
    <line x1="198" y1="230" x2="248" y2="230" stroke="#94A3B8" stroke-width="4" stroke-linecap="round" stroke-opacity="0.75" />
  </g>

  <!-- === Layer 2: Main Optical Search Ring (Precision Lens) === -->
  <!-- Outer precision ring with dynamic break revealing the document -->
  <circle cx="226" cy="226" r="102" fill="none" stroke="url(#lensRing)" stroke-width="26" stroke-linecap="round" />

  <!-- Search Optic Handle / Vector Beam -->
  <!-- Sleek 45-degree prism stem -->
  <path d="M304 304 L384 384" stroke="url(#beamGrad)" stroke-width="32" stroke-linecap="round" />
  <!-- Secondary accent cap on handle -->
  <path d="M344 344 L396 396" stroke="#2878F0" stroke-width="18" stroke-linecap="round" opacity="0.6" />

  <!-- === Layer 3: The Discovery Focal Sparkle (Top-Right of Lens) === -->
  <!-- 4-point precision sparkle representing instant search hit -->
  <g transform="translate(296, 156)">
    <!-- Vertical Diamond Beam -->
    <path d="M0 -22 Q0 0 22 0 Q0 0 0 22 Q0 0 -22 0 Q0 0 0 -22 Z" fill="url(#starGrad)" />
    <!-- Core Bright Dot -->
    <circle cx="0" cy="0" r="4" fill="#FFFFFF" />
  </g>

  <!-- Small secondary discovery particle -->
  <circle cx="152" cy="172" r="5" fill="#38BDF8" opacity="0.75" />
</svg>

