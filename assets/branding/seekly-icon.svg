<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Deep navy-to-slate background -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A2540"/>
      <stop offset="100%" stop-color="#0D1426"/>
    </linearGradient>
    <!-- Accent gradient for the lens ring -->
    <linearGradient id="lensGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F9EFF"/>
      <stop offset="100%" stop-color="#2E6FD8"/>
    </linearGradient>
    <!-- Subtle inner glow on lens -->
    <radialGradient id="lensGlow" cx="40%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#7BBFFF" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#7BBFFF" stop-opacity="0"/>
    </radialGradient>
    <!-- Handle gradient -->
    <linearGradient id="handleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F9EFF"/>
      <stop offset="100%" stop-color="#1A4FA8"/>
    </linearGradient>
    <!-- Clip path for rounded square (squircle) background -->
    <clipPath id="squircleClip">
      <rect x="0" y="0" width="512" height="512" rx="110" ry="110"/>
    </clipPath>
  </defs>

  <!-- Background squircle -->
  <rect x="0" y="0" width="512" height="512" rx="110" ry="110" fill="url(#bg)"/>

  <!-- Subtle top-left highlight -->
  <ellipse cx="160" cy="130" rx="200" ry="160" fill="#FFFFFF" opacity="0.03"/>

  <!-- ── MAGNIFYING GLASS ── -->
  <!-- Outer lens ring -->
  <circle cx="222" cy="218" r="118" fill="none" stroke="url(#lensGrad)" stroke-width="34"/>
  <!-- Inner glass surface -->
  <circle cx="222" cy="218" r="84" fill="#0D1426" opacity="0.85"/>
  <!-- Inner glow overlay -->
  <circle cx="222" cy="218" r="84" fill="url(#lensGlow)"/>

  <!-- Glass shine arc (top-left highlight) -->
  <path d="M 166 162 A 72 72 0 0 1 238 148" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" fill="none" opacity="0.30"/>

  <!-- Handle — thick rounded rod at 45° pointing bottom-right -->
  <line x1="314" y1="310" x2="388" y2="384"
        stroke="url(#handleGrad)" stroke-width="46" stroke-linecap="round"/>

  <!-- ── LETTER S INSIDE LENS ── -->
  <!-- A clean geometric "S" curve built from two arcs -->
  <path d="
    M 254 188
    C 254 172, 240 162, 222 162
    C 204 162, 190 172, 190 187
    C 190 202, 200 210, 222 216
    C 244 222, 256 230, 256 248
    C 256 264, 242 274, 222 274
    C 202 274, 188 264, 188 248
  "
  fill="none"
  stroke="#4F9EFF"
  stroke-width="22"
  stroke-linecap="round"
  stroke-linejoin="round"/>
</svg>
