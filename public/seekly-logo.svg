<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 80" width="420" height="80">
  <defs>
    <linearGradient id="iconBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A2540"/>
      <stop offset="100%" stop-color="#0D1426"/>
    </linearGradient>
    <linearGradient id="lensGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F9EFF"/>
      <stop offset="100%" stop-color="#2E6FD8"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#CBD8F0"/>
    </linearGradient>
  </defs>

  <!-- Icon squircle background -->
  <rect x="0" y="4" width="72" height="72" rx="16" ry="16" fill="url(#iconBg)"/>

  <!-- Magnifying glass (scaled to fit 72×72 icon) -->
  <!-- Outer ring -->
  <circle cx="31" cy="31" r="16.5" fill="none" stroke="url(#lensGrad)" stroke-width="5"/>
  <!-- Inner glass -->
  <circle cx="31" cy="31" r="11" fill="#0D1426" opacity="0.85"/>
  <!-- Shine arc -->
  <path d="M 23 23 A 10 10 0 0 1 33 21" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.35"/>
  <!-- Handle -->
  <line x1="43.5" y1="43.5" x2="55" y2="55" stroke="url(#lensGrad)" stroke-width="6.5" stroke-linecap="round"/>
  <!-- S inside lens -->
  <path d="M 36 26.5 C 36 23.5,33.5 22,31 22 C 28.5 22,26 23.5,26 26 C 26 28.5,28 29.5,31 30.5 C 34 31.5,36 32.5,36 35.5 C 36 38,33.5 39.5,31 39.5 C 28.5 39.5,26 38,26 35.5"
    fill="none" stroke="#4F9EFF" stroke-width="3.2" stroke-linecap="round"/>

  <!-- SEEKLY wordmark -->
  <text x="88" y="51"
    font-family="'Segoe UI', 'Inter', 'Helvetica Neue', sans-serif"
    font-size="38"
    font-weight="700"
    letter-spacing="-0.5"
    fill="url(#textGrad)">Seekly</text>
</svg>
